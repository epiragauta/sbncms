<div class="umb-dashboard-grid" ng-controller="Sbn.Dashboard.StartUpDynamicContentController as vm">

    <umb-load-indicator ng-if="vm.loading"></umb-load-indicator>

    <div class="row clearfix" ng-if="vm.dashboard">
        <!-- Sections -->
        <div class="grid-section" ng-repeat="section in vm.dashboard.sections">
            <div class="{{'span' + section.grid + ' column dash-section'}}">

                <!-- rows -->
                <div class="row clearfix dash-row" ng-repeat="row in section.rows">
                    <div class="dash-inner-row">

                        <!-- areas -->
                        <div ng-repeat="area in row.areas"
                             class="{{'span' + area.grid + ' column dash-area'}}">
                            <div class="dash-inner-area">

                                <!-- Controls -->
                                <div ng-repeat="control in area.controls" class="dash-control dash-control-{{control.alias}}">
                                    <div class="dash-inner-control">
                                        <div ng-bind-html="control.html | safe_html"></div>
                                    </div>
                                </div>
                                <!-- Controls end -->
                            </div>
                        </div>
                        <!-- Area end -->
                    </div>
                </div>
            </div>
            <!-- Section end -->

        </div>
    </div>
    <!-- grid container end -->

    <!-- Default content in case we cannot fetch content from the outside -->
    <div style="max-width: 1200px" style="display: none;">

        <div class="welcome-dashboard__intro">
            <h1 class="welcome-dashboard__title">
                <localize key="startupDashboard_fallbackHeadline">Administrador Herramienta SbN (CMS)</localize>
            </h1>
            <p class="welcome-dashboard__intro-text">
                <localize key="startupDashboard_fallbackDescription">Aplicación Web para la creación y administración de contenido para las Soluciones basadas an la Naturaleza</localize>
            </p>
        </div>



    </div>

</div>
