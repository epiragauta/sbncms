<div ng-controller="Sbn.Editors.Guest.UsersGuestController as vm" class="clearfix">

    <!-- Users Overview -->
    <div ng-if="vm.usersViewState === 'overview'">

        <umb-load-indicator ng-show="vm.loading"></umb-load-indicator>

        <umb-editor-sub-header ng-class="{'--state-selection':(vm.selection.length > 0)}">

            <!-- No selection -->
            <umb-editor-sub-header-content-left ng-if="vm.selection.length === 0">
                <umb-button-group
                    ng-if="vm.defaultButton"
                    button-style="outline"
                    default-button="vm.defaultButton"
                    sub-buttons="vm.subButtons">
                </umb-button-group>
            </umb-editor-sub-header-content-left>

            <!-- With selection -->
            <umb-editor-sub-header-content-left ng-if="vm.selection.length > 0">
                <umb-editor-sub-header-section>
                    <umb-button
                        type="button"
                        button-style="white"
                        label-key="buttons_clearSelection"
                        action="vm.clearSelection()"
                        disabled="actionInProgress">
                    </umb-button>
                </umb-editor-sub-header-section>
                <umb-editor-sub-header-section>
                    <strong>{{ vm.selection.length }} <localize key="general_of">of</localize> {{ vm.users.length }} <localize key="general_selected">selected</localize></strong>
                </umb-editor-sub-header-section>
            </umb-editor-sub-header-content-left>
        </umb-editor-sub-header>

        <!-- Filters -->
        <div class="flex items-center mb3">

            <div style="font-size: 16px;">
                <span class="bold"><localize key="sections_users">Users</localize></span> 
                <span ng-if="vm.usersOptions.totalItems">({{vm.usersOptions.totalItems}})</span>
            </div>
            
        </div>

        <!-- Empty states -->
        <umb-empty-state
            ng-if="!vm.loading && !vm.users.length && vm.usersOptions.filter.length > 0"
            position="center">
            <localize key="general_searchNoResult"></localize>
        </umb-empty-state>

        <!-- Layout: Table -->
        <div>

            <div class="umb-table umb-user-table" ng-class="{'-has-selection': vm.selection.length > 0}">
                <div class="umb-table-head">
                    <div class="umb-table-row">
                        <div class="umb-table-cell"></div>
                        <div class="umb-table-cell">Correo</div>
                        <div class="umb-table-cell">Nombre</div>
                        <div class="umb-table-cell">Organización</div>
                        <div class="umb-table-cell">Sector</div>
                    </div>
                </div>
                <div class="umb-table-body">
                    <div ng-repeat="user in vm.users" class="umb-table-row umb-user-table-row umb-outline umb-outline--surrounding">                        
                        <div class="umb-table-cell"></div>
                        <div class="umb-table-cell">{{user.email}}</div>
                        <div class="umb-table-cell"><div>{{ user.fullName }}</div></div>
                        <div class="umb-table-cell">{{ user.organization }}</div>
                        <div class="umb-table-cell">{{ user.sector }}</div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Pagination -->
        <div ng-if="!vm.loading" class="flex justify-center">
            <umb-pagination
                ng-if="vm.usersOptions.totalPages"
                page-number="vm.usersOptions.pageNumber"
                total-pages="vm.usersOptions.totalPages"
                on-change="vm.changePageNumber(pageNumber)">
            </umb-pagination>
        </div>
    </div>   

</div>
